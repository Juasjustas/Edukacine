<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greitoji viktorina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <section id="intro" class="card">
    <h1 id="introTitle">Greitoji viktorina</h1>
    <div id="introText" style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="row"><button class="btn" id="startBtn" type="button">Pradėti</button></div>
  </section>

  <section id="quiz" class="card" hidden>
    <div class="topline">
      <span class="label" id="qnum">Klausimas 1 iš 20</span>
      <span class="secs" id="secs">10</span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <h2 id="qtext">Klausimas</h2>
    <div class="opts" id="opts"></div>
    <div class="quizfoot">
      <p class="hint" id="hint"></p>
      <button class="btn ghost sm" id="skipBtn" type="button">Praleisti klausimą →</button>
    </div>
  </section>

  <section id="done" class="card" hidden>
    <h1>Viskas!</h1>
    <p class="status" id="sendStatus" aria-live="polite">Siunčiami tavo atsakymai…</p>
    <div id="fallback" hidden>
      <p>Parodyk šį kodą mokytojui:</p>
      <p class="code" id="code">—</p>
      <button class="btn ghost sm" id="retryBtn" type="button">Bandyti siųsti dar kartą</button>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script>
(function () {
  const C = window.QUIZ_CONFIG;
  const QUESTIONS = C.QUESTIONS.map(q => ({ ...q, crowdIdx: "ABCD".indexOf(String(q.crowd).toUpperCase()), correctIdx: "ABCD".indexOf(String(q.correct || "").toUpperCase()) }));
  const N = QUESTIONS.length;
  const LETTERS = ["A", "B", "C", "D"];
  const PEER_COLORS = [1,2,3,4,5,6,7].map(n => `var(--peer-${n})`);
  const PERSON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.6-4.6 4.1-7.2 8.5-7.2s7.9 2.6 8.5 7.2z"/></svg>';
  const $ = id => document.getElementById(id);

  // Class label from the link, e.g. ...?class=7A
  const params = new URLSearchParams(location.search);
  const CLASS = (params.get("class") || "").replace(/[^\w-]/g, "").slice(0, 20);
  // Group: random 50/50. For testing: ?group=influence or ?group=control
  const forced = params.get("group");
  const GROUP = forced === "influence" || forced === "control" ? forced : (Math.random() < 0.5 ? "influence" : "control");
  const RUN_ID = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // Start screen: different instructions per group
  $("introTitle").textContent = C.INTRO_TITLE || "Greitoji viktorina";
  ((GROUP === "influence" ? C.INTRO_INFLUENCE : C.INTRO_CONTROL) || []).forEach(t => {
    const p = document.createElement("p"); p.textContent = t; $("introText").appendChild(p);
  });

  let qi = 0, choice = null, answers = [], timers = [], tickTimer = null, deadline = 0;

  function show(id) { ["intro", "quiz", "done"].forEach(s => $(s).hidden = s !== id); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; clearInterval(tickTimer); }

  function render() {
    const q = QUESTIONS[qi];
    choice = null;
    $("qnum").textContent = `Klausimas ${qi + 1} iš ${N}`;
    $("qtext").textContent = q.text;
    $("hint").textContent = "";
    const box = $("opts");
    box.innerHTML = "";
    q.options.forEach((t, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.id = `opt${i}`;
      b.innerHTML = `<span class="letter">${LETTERS[i]}</span><span class="otext"></span><span class="peers" aria-hidden="true"></span>`;
      b.querySelector(".otext").textContent = t;
      b.addEventListener("click", () => select(i));
      box.appendChild(b);
    });

    const secs = C.SECONDS_PER_QUESTION;
    deadline = performance.now() + secs * 1000;
    const fill = $("barFill");
    fill.style.transition = "none"; fill.style.transform = "scaleX(1)"; fill.classList.remove("low");
    $("secs").classList.remove("low");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fill.style.transition = `transform ${secs}s linear`;
      fill.style.transform = "scaleX(0)";
    }));
    tick();
    tickTimer = setInterval(tick, 200);
    timers.push(setTimeout(next, secs * 1000));

    if (GROUP === "influence" && q.crowdIdx >= 0) schedulePeers(q.crowdIdx);
  }

  function schedulePeers(crowd) {
    const others = [0,1,2,3].filter(i => i !== crowd);
    const decoy = others[Math.floor(Math.random() * others.length)];
    const seq = Array(C.PEERS_ON_CROWD).fill(crowd);
    for (let k = 0; k < C.PEERS_ELSEWHERE; k++) seq.splice(1 + Math.floor(Math.random() * seq.length), 0, decoy);
    const colors = [...PEER_COLORS].sort(() => Math.random() - 0.5);
    seq.forEach((opt, n) => {
      timers.push(setTimeout(() => {
        const strip = document.querySelector(`#opt${opt} .peers`);
        if (!strip) return;
        const p = document.createElement("span");
        p.className = "peer";
        p.style.background = colors[n % colors.length];
        p.innerHTML = PERSON;
        strip.appendChild(p);
      }, C.PEERS_START_AT * 1000 + n * C.PEER_INTERVAL_MS + Math.random() * 200));
    });
  }

  function tick() {
    const left = Math.max(0, Math.ceil((deadline - performance.now()) / 1000));
    $("secs").textContent = left;
    if (left <= 3) { $("secs").classList.add("low"); $("barFill").classList.add("low"); }
  }

  function select(i) {
    choice = i;
    document.querySelectorAll(".opt").forEach((b, k) => b.classList.toggle("sel", k === i));
    $("hint").textContent = "Atsakymas pažymėtas. Dar gali jį pakeisti.";
  }

  function next() {
    clearTimers();
    answers.push(choice);
    qi++;
    if (qi < N) render(); else finish();
  }

  /* ---------- Sending ---------- */
  function buildResult() {
    // matched = went with the crowd on a trap question (where the crowd is wrong)
    let matched = 0, other = 0, skipped = 0, correct = 0;
    answers.forEach((a, i) => {
      const q = QUESTIONS[i];
      if (a === null) { skipped++; return; }
      if (a === q.correctIdx) correct++;
      if (a === q.crowdIdx && q.crowdIdx !== q.correctIdx) matched++;
      else other++;
    });
    return {
      id: RUN_ID,
      cls: CLASS,
      team: GROUP,
      answers: answers.map(a => a === null ? "-" : LETTERS[a]).join(""),
      matched, other, skipped, correct
    };
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // Returns true only when Google confirms the row was saved.
  async function send(result) {
    if (!C.SCRIPT_URL || C.SCRIPT_URL.indexOf("script.google.com") === -1) throw new Error("not configured");
    const body = JSON.stringify(result);
    try {
      // text/plain keeps this a "simple" request, so Google answers without a CORS preflight
      // and we can read its reply.
      const res = await fetch(C.SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body });
      const data = await res.json(); // a busy/error page from Google isn't JSON -> throws -> retry
      return data && data.ok === true;
    } catch (err) {
      if (err instanceof TypeError && !navigator.onLine) return false; // offline: retry later
      if (err instanceof SyntaxError) return false;                    // Google replied with an error page
      // Some school networks block reading the reply. Fall back to a blind send.
      await fetch(C.SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body });
      return true;
    }
  }

  async function sendWithRetry(result, firstTry) {
    $("sendStatus").className = "status";
    $("sendStatus").textContent = "Siunčiami tavo atsakymai…";
    $("fallback").hidden = true;
    // Everyone finishes at about the same moment, so spread the first sends over ~4 seconds.
    if (firstTry) await sleep(Math.random() * 4000);
    // The script ignores duplicate ids, so retrying never creates double rows.
    for (let attempt = 0; attempt < 6; attempt++) {
      try {
        if (await send(result)) {
          $("sendStatus").className = "status ok";
          $("sendStatus").textContent = "Tavo atsakymai išsiųsti. Ačiū! Gali padėti įrenginį.";
          return;
        }
      } catch (err) {
        if (err.message === "not configured") break;
      }
      await sleep(1500 * (attempt + 1) + Math.random() * 1500);
    }
    $("sendStatus").className = "status bad";
    $("sendStatus").textContent = "Nepavyko išsiųsti tavo atsakymų.";
    $("code").textContent = `${result.team === "influence" ? "B" : "R"}-${String(result.correct).padStart(2, "0")}-${String(result.matched).padStart(2, "0")}`;
    $("fallback").hidden = false;
  }

  let lastResult = null;
  function finish() {
    show("done");
    lastResult = buildResult();
    sendWithRetry(lastResult, true);
  }

  $("retryBtn").addEventListener("click", () => lastResult && sendWithRetry(lastResult, false));
  $("skipBtn").addEventListener("click", () => { choice = null; next(); });
  $("startBtn").addEventListener("click", () => { show("quiz"); qi = 0; answers = []; render(); });
})();
</script>
</body>
</html>
